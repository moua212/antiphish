services:
  phishing_api:
    build: .
    image: issam/phishing_v1
    container_name: phishing_countainer
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app:cached
    env_file:
      - .env
  db:
    image: postgres:15
    container_name: postgres_db_phishing
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  frontend:
    image: nginx:alpine
    container_name: antiphish_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - phishing_api
volumes:
  postgres_data:
  